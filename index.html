<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileVault - Persistent File Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dropzone {
            border: 2px dashed #7e22ce;
            transition: all 0.3s ease;
        }
        .dropzone.active {
            border-color: #9333ea;
            background-color: rgba(167, 139, 250, 0.1);
        }
        .file-item {
            transition: all 0.2s ease;
        }
        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .progress-bar {
            height: 4px;
            background-color: #e9d5ff;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #7e22ce;
            transition: width 0.3s ease;
        }
        .copy-btn {
            transition: all 0.2s ease;
        }
        .copy-btn.copied {
            background-color: #10b981;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-purple-800 mb-2">FileVault</h1>
            <p class="text-gray-600">Persistent file storage accessible from any device</p>
        </header>

        <!-- Upload Section -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <div 
                id="dropzone" 
                class="dropzone rounded-lg p-8 text-center cursor-pointer mb-4"
                ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)"
                ondrop="handleDrop(event)"
            >
                <div class="flex flex-col items-center justify-center space-y-4">
                    <div class="bg-purple-100 p-4 rounded-full">
                        <i class="fas fa-cloud-upload-alt text-purple-600 text-3xl"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-gray-800">Drag & drop files here</h3>
                    <p class="text-gray-500">or</p>
                    <label for="fileInput" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-6 rounded-full cursor-pointer transition duration-300">
                        <i class="fas fa-folder-open mr-2"></i> Select Files
                    </label>
                    <input 
                        id="fileInput" 
                        type="file" 
                        class="hidden" 
                        multiple 
                        onchange="handleFileSelect(event)"
                    />
                </div>
            </div>
            
            <!-- Progress Bar -->
            <div id="progressContainer" class="hidden">
                <div class="flex justify-between mb-1">
                    <span class="text-sm font-medium text-purple-900">Uploading...</span>
                    <span id="progressPercent" class="text-sm font-medium text-purple-900">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- File List Section -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold text-purple-900 flex items-center">
                    <i class="fas fa-file-alt mr-2"></i> Your Files
                </h2>
                <div class="flex items-center space-x-2">
                    <div class="relative">
                        <select id="sortSelect" class="appearance-none bg-gray-100 border border-gray-200 text-gray-700 py-2 px-4 pr-8 rounded-full leading-tight focus:outline-none focus:bg-white focus:border-purple-500 text-sm" onchange="sortFiles()">
                            <option value="newest">Newest first</option>
                            <option value="oldest">Oldest first</option>
                            <option value="name-asc">Name (A-Z)</option>
                            <option value="name-desc">Name (Z-A)</option>
                            <option value="size-asc">Size (smallest)</option>
                            <option value="size-desc">Size (largest)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                            <i class="fas fa-sort text-sm"></i>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="fileList" class="space-y-3">
                <!-- Files will appear here -->
                <div id="emptyState" class="text-center py-8">
                    <i class="fas fa-folder-open text-gray-300 text-5xl mb-3"></i>
                    <p class="text-gray-500">No files uploaded yet</p>
                </div>
            </div>
        </div>

        <!-- Language Toggle -->
        <div class="mt-6 text-center">
            <button 
                id="languageToggle" 
                class="text-purple-600 hover:text-purple-800 transition duration-300"
                onclick="toggleLanguage()"
            >
                <i class="fas fa-language mr-1"></i> Türkçe / English
            </button>
        </div>
    </div>

    <script>
        // Store uploaded files (in a real app, these would come from server)
        let uploadedFiles = [];
        let currentLanguage = 'en';
        
        // Language translations
        const translations = {
            en: {
                title: "FileVault",
                subtitle: "Persistent file storage accessible from any device",
                dragDrop: "Drag & drop files here",
                or: "or",
                selectFiles: "Select Files",
                yourFiles: "Your Files",
                noFiles: "No files uploaded yet",
                download: "Download",
                delete: "Delete",
                copyLink: "Copy Link",
                copied: "Copied!",
                uploading: "Uploading...",
                changeLanguage: "Türkçe / English",
                sortOptions: {
                    newest: "Newest first",
                    oldest: "Oldest first",
                    nameAsc: "Name (A-Z)",
                    nameDesc: "Name (Z-A)",
                    sizeAsc: "Size (smallest)",
                    sizeDesc: "Size (largest)"
                }
            },
            tr: {
                title: "Dosya Kasası",
                subtitle: "Her cihazdan erişilebilen kalıcı dosya depolama",
                dragDrop: "Dosyaları buraya sürükleyin",
                or: "veya",
                selectFiles: "Dosya Seç",
                yourFiles: "Dosyalarınız",
                noFiles: "Henüz dosya yüklenmedi",
                download: "İndir",
                delete: "Sil",
                copyLink: "Linki Kopyala",
                copied: "Kopyalandı!",
                uploading: "Yükleniyor...",
                changeLanguage: "Türkçe / English",
                sortOptions: {
                    newest: "Yeniden eskiye",
                    oldest: "Eskiden yeniye",
                    nameAsc: "İsme göre (A-Z)",
                    nameDesc: "İsme göre (Z-A)",
                    sizeAsc: "Boyut (küçükten)",
                    sizeDesc: "Boyut (büyükten)"
                }
            }
        };

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            // In a real app, we would fetch files from the server here
            // fetchFilesFromServer();
            
            // For demo purposes, we'll simulate loading some files
            setTimeout(() => {
                // Simulate loading files from server
                const demoFiles = [
                    { name: 'Project_Report.pdf', size: 2456789, uploadedAt: new Date(Date.now() - 86400000), url: '#' },
                    { name: 'Vacation_Photos.zip', size: 12546789, uploadedAt: new Date(Date.now() - 172800000), url: '#' },
                    { name: 'Presentation.pptx', size: 4567890, uploadedAt: new Date(Date.now() - 3600000), url: '#' }
                ];
                
                demoFiles.forEach(file => {
                    uploadedFiles.push(file);
                    addFileToUI(file);
                });
                
                if (uploadedFiles.length > 0) {
                    document.getElementById('emptyState').style.display = 'none';
                }
            }, 800);
        });

        // Toggle between languages
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'en' ? 'tr' : 'en';
            updateLanguage();
        }

        // Update all text elements with current language
        function updateLanguage() {
            const lang = translations[currentLanguage];
            document.querySelector('h1').textContent = lang.title;
            document.querySelector('header p').textContent = lang.subtitle;
            document.querySelector('#dropzone h3').textContent = lang.dragDrop;
            document.querySelector('#dropzone p').textContent = lang.or;
            document.querySelector('#dropzone label').innerHTML = `<i class="fas fa-folder-open mr-2"></i> ${lang.selectFiles}`;
            document.querySelector('.bg-white.rounded-xl h2').innerHTML = `<i class="fas fa-file-alt mr-2"></i> ${lang.yourFiles}`;
            document.querySelector('#emptyState p').textContent = lang.noFiles;
            document.querySelector('#languageToggle').innerHTML = `<i class="fas fa-language mr-1"></i> ${lang.changeLanguage}`;
            
            // Update sort options
            const sortSelect = document.getElementById('sortSelect');
            sortSelect.options[0].text = lang.sortOptions.newest;
            sortSelect.options[1].text = lang.sortOptions.oldest;
            sortSelect.options[2].text = lang.sortOptions.nameAsc;
            sortSelect.options[3].text = lang.sortOptions.nameDesc;
            sortSelect.options[4].text = lang.sortOptions.sizeAsc;
            sortSelect.options[5].text = lang.sortOptions.sizeDesc;
            
            // Update buttons in file list
            document.querySelectorAll('.download-btn').forEach(btn => {
                btn.innerHTML = `<i class="fas fa-download mr-1"></i> ${lang.download}`;
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.innerHTML = `<i class="fas fa-trash mr-1"></i> ${lang.delete}`;
            });
            
            document.querySelectorAll('.copy-btn').forEach(btn => {
                if (!btn.classList.contains('copied')) {
                    btn.innerHTML = `<i class="fas fa-link mr-1"></i> ${lang.copyLink}`;
                }
            });
            
            if (document.getElementById('progressContainer').style.display !== 'none') {
                document.querySelector('#progressContainer span:first-child').textContent = lang.uploading;
            }
        }

        // Handle drag over event
        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropzone').classList.add('active');
        }

        // Handle drag leave event
        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropzone').classList.remove('active');
        }

        // Handle drop event
        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropzone').classList.remove('active');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadFiles(files);
            }
        }

        // Handle file selection via input
        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                uploadFiles(files);
            }
            // Reset the input to allow selecting the same file again
            e.target.value = '';
        }

        // Upload files to server
        function uploadFiles(files) {
            // Show progress bar
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressPercent = document.getElementById('progressPercent');
            
            progressContainer.classList.remove('hidden');
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
            
            // Simulate upload progress (in a real app, this would be actual upload progress)
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                progressFill.style.width = `${progress}%`;
                progressPercent.textContent = `${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        progressContainer.classList.add('hidden');
                        
                        // In a real app, we would send files to the server here
                        // and receive the stored file data in response
                        
                        // For demo, we'll simulate server response
                        Array.from(files).forEach(file => {
                            const serverFile = {
                                name: file.name,
                                size: file.size,
                                uploadedAt: new Date(),
                                url: '#' // In real app, this would be the server URL
                            };
                            
                            uploadedFiles.push(serverFile);
                            addFileToUI(serverFile);
                        });
                        
                        // Hide empty state if it's the first file
                        if (uploadedFiles.length === files.length) {
                            document.getElementById('emptyState').style.display = 'none';
                        }
                        
                        // Sort files by newest first
                        sortFiles('newest');
                    }, 500);
                }
            }, 100);
        }

        // Add a file to the UI list
        function addFileToUI(file) {
            const fileList = document.getElementById('fileList');
            const lang = translations[currentLanguage];
            
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item bg-gray-50 rounded-lg p-4 flex items-center justify-between';
            
            const fileInfo = document.createElement('div');
            fileInfo.className = 'flex items-center';
            
            const fileIcon = document.createElement('div');
            fileIcon.className = 'bg-purple-100 p-2 rounded-lg mr-3';
            
            const icon = document.createElement('i');
            icon.className = 'fas ' + getFileIcon(file.name) + ' text-purple-600';
            fileIcon.appendChild(icon);
            
            const fileName = document.createElement('div');
            fileName.className = 'flex flex-col';
            
            const name = document.createElement('span');
            name.className = 'font-medium text-gray-800';
            name.textContent = file.name;
            
            const details = document.createElement('div');
            details.className = 'flex space-x-3 text-xs text-gray-500';
            
            const size = document.createElement('span');
            size.textContent = formatFileSize(file.size);
            
            const date = document.createElement('span');
            date.textContent = formatDate(file.uploadedAt);
            
            details.appendChild(size);
            details.appendChild(date);
            
            fileName.appendChild(name);
            fileName.appendChild(details);
            
            fileInfo.appendChild(fileIcon);
            fileInfo.appendChild(fileName);
            
            const fileActions = document.createElement('div');
            fileActions.className = 'flex space-x-2';
            
            // Copy Link Button
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded-full text-sm transition duration-300';
            copyBtn.innerHTML = `<i class="fas fa-link mr-1"></i> ${lang.copyLink}`;
            copyBtn.onclick = () => copyFileLink(file, copyBtn);
            
            // Download Button
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'download-btn bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-full text-sm transition duration-300';
            downloadBtn.innerHTML = `<i class="fas fa-download mr-1"></i> ${lang.download}`;
            downloadBtn.onclick = () => downloadFile(file);
            
            // Delete Button
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded-full text-sm transition duration-300';
            deleteBtn.innerHTML = `<i class="fas fa-trash mr-1"></i> ${lang.delete}`;
            deleteBtn.onclick = () => deleteFile(file, fileItem);
            
            fileActions.appendChild(copyBtn);
            fileActions.appendChild(downloadBtn);
            fileActions.appendChild(deleteBtn);
            
            fileItem.appendChild(fileInfo);
            fileItem.appendChild(fileActions);
            
            fileList.insertBefore(fileItem, fileList.firstChild);
        }

        // Sort files based on selected option
        function sortFiles() {
            const sortSelect = document.getElementById('sortSelect');
            const sortBy = sortSelect.value;
            
            const fileList = document.getElementById('fileList');
            const items = Array.from(fileList.children).filter(el => el.id !== 'emptyState');
            
            // Sort the items array based on the selected option
            items.sort((a, b) => {
                const fileA = uploadedFiles.find(f => 
                    f.name === a.querySelector('span.font-medium').textContent
                );
                const fileB = uploadedFiles.find(f => 
                    f.name === b.querySelector('span.font-medium').textContent
                );
                
                switch(sortBy) {
                    case 'newest':
                        return fileB.uploadedAt - fileA.uploadedAt;
                    case 'oldest':
                        return fileA.uploadedAt - fileB.uploadedAt;
                    case 'name-asc':
                        return fileA.name.localeCompare(fileB.name);
                    case 'name-desc':
                        return fileB.name.localeCompare(fileA.name);
                    case 'size-asc':
                        return fileA.size - fileB.size;
                    case 'size-desc':
                        return fileB.size - fileA.size;
                    default:
                        return 0;
                }
            });
            
            // Re-append sorted items to the file list
            items.forEach(item => fileList.appendChild(item));
        }

        // Copy file link to clipboard
        function copyFileLink(file, button) {
            const lang = translations[currentLanguage];
            
            // In a real app, this would be the actual file URL from the server
            const fileUrl = `${window.location.origin}/files/${encodeURIComponent(file.name)}`;
            
            // Simulate copying to clipboard
            navigator.clipboard.writeText(fileUrl).then(() => {
                button.innerHTML = `<i class="fas fa-check mr-1"></i> ${lang.copied}`;
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.innerHTML = `<i class="fas fa-link mr-1"></i> ${lang.copyLink}`;
                    button.classList.remove('copied');
                }, 2000);
            });
        }

        // Download a file
        function downloadFile(file) {
            // In a real app, this would download from the server URL
            // For demo, we'll create a dummy download
            const url = URL.createObjectURL(new Blob([`This is a demo file representing ${file.name}`], {type: 'application/octet-stream'}));
            const a = document.createElement('a');
            a.href = url;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Delete a file
        function deleteFile(file, element) {
            // In a real app, we would send a delete request to the server
            // For demo, we'll just remove from the UI
            
            uploadedFiles = uploadedFiles.filter(f => 
                f.name !== file.name || f.size !== file.size || f.uploadedAt.getTime() !== file.uploadedAt.getTime()
            );
            
            element.remove();
            
            // Show empty state if no files left
            if (uploadedFiles.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
            }
        }

        // Helper function to get file icon based on extension
        function getFileIcon(filename) {
            const extension = filename.split('.').pop().toLowerCase();
            
            switch(extension) {
                case 'pdf':
                    return 'fa-file-pdf';
                case 'doc':
                case 'docx':
                    return 'fa-file-word';
                case 'xls':
                case 'xlsx':
                    return 'fa-file-excel';
                case 'ppt':
                case 'pptx':
                    return 'fa-file-powerpoint';
                case 'jpg':
                case 'jpeg':
                case 'png':
                case 'gif':
                case 'svg':
                case 'webp':
                    return 'fa-file-image';
                case 'zip':
                case 'rar':
                case '7z':
                case 'tar':
                case 'gz':
                    return 'fa-file-archive';
                case 'mp3':
                case 'wav':
                case 'ogg':
                case 'flac':
                    return 'fa-file-audio';
                case 'mp4':
                case 'avi':
                case 'mov':
                case 'mkv':
                case 'webm':
                    return 'fa-file-video';
                case 'txt':
                case 'rtf':
                case 'md':
                    return 'fa-file-alt';
                case 'html':
                case 'htm':
                case 'css':
                case 'js':
                case 'json':
                case 'php':
                case 'py':
                case 'java':
                case 'c':
                case 'cpp':
                case 'cs':
                    return 'fa-file-code';
                default:
                    return 'fa-file';
            }
        }

        // Helper function to format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Helper function to format date
        function formatDate(date) {
            const options = { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return new Date(date).toLocaleDateString(undefined, options);
        }
    </script>
</body>
</html>
