<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncShare - Real-Time File Sharing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .file-upload-container {
            border: 2px dashed #8b5cf6;
            transition: all 0.3s ease;
        }
        .file-upload-container:hover {
            border-color: #7c3aed;
            background-color: rgba(139, 92, 246, 0.05);
        }
        .file-upload-container.drag-over {
            border-color: #7c3aed;
            background-color: rgba(139, 92, 246, 0.1);
        }
        .file-item {
            transition: all 0.2s ease;
        }
        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .progress-bar {
            transition: width 0.3s ease;
        }
        .toast {
            animation: slideIn 0.3s ease-out, fadeOut 0.5s ease 3s forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center">
                <div class="bg-purple-600 text-white p-3 rounded-lg mr-4">
                    <i class="fas fa-file-export text-2xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800">SyncShare</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button id="language-toggle" class="flex items-center text-gray-600 hover:text-purple-600 transition">
                    <i class="fas fa-globe mr-2"></i>
                    <span>EN</span>
                </button>
                <div class="relative group">
                    <button class="flex items-center text-gray-600 hover:text-purple-600 transition">
                        <i class="fas fa-cog"></i>
                    </button>
                    <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-10 hidden group-hover:block">
                        <a href="#" class="block px-4 py-2 text-gray-800 hover:bg-purple-50">Settings</a>
                        <a href="#" class="block px-4 py-2 text-gray-800 hover:bg-purple-50">Help</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Upload Section -->
            <section class="mb-12">
                <div class="file-upload-container bg-white rounded-xl p-8 text-center cursor-pointer" id="dropzone">
                    <input type="file" id="file-input" class="hidden" multiple>
                    <div class="mx-auto max-w-md">
                        <div class="bg-purple-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-cloud-upload-alt text-purple-600 text-2xl"></i>
                        </div>
                        <h2 class="text-xl font-semibold text-gray-800 mb-2">Drag & drop files here</h2>
                        <p class="text-gray-500 mb-4">or click to browse your files</p>
                        <button id="upload-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-6 rounded-lg transition">
                            Select Files
                        </button>
                    </div>
                </div>
                
                <!-- Upload Progress (hidden by default) -->
                <div id="upload-progress" class="mt-4 hidden">
                    <div class="flex justify-between mb-1">
                        <span class="text-sm font-medium text-gray-700">Uploading...</span>
                        <span id="upload-percentage" class="text-sm font-medium text-gray-700">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="progress-bar bg-purple-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </section>

            <!-- File List Section -->
            <section>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-semibold text-gray-800">Your Files</h2>
                    <div class="flex items-center space-x-2">
                        <div class="relative">
                            <button id="sort-button" class="flex items-center text-gray-600 hover:text-purple-600 transition px-3 py-1 rounded-lg hover:bg-purple-50">
                                <i class="fas fa-sort mr-2"></i>
                                <span>Sort</span>
                            </button>
                            <div id="sort-options" class="absolute right-0 mt-1 w-40 bg-white rounded-md shadow-lg py-1 z-10 hidden">
                                <a href="#" class="block px-4 py-2 text-gray-800 hover:bg-purple-50 sort-option" data-sort="name">By Name</a>
                                <a href="#" class="block px-4 py-2 text-gray-800 hover:bg-purple-50 sort-option" data-sort="date">By Date</a>
                                <a href="#" class="block px-4 py-2 text-gray-800 hover:bg-purple-50 sort-option" data-sort="size">By Size</a>
                            </div>
                        </div>
                        <button id="refresh-button" class="p-2 text-gray-600 hover:text-purple-600 hover:bg-purple-50 rounded-full transition">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>

                <div id="file-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Files will be dynamically added here -->
                    <div class="file-item bg-white rounded-lg p-4 border border-gray-200 flex items-start">
                        <div class="mr-4">
                            <div class="bg-purple-100 text-purple-600 p-3 rounded-lg">
                                <i class="fas fa-file-pdf text-xl"></i>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <h3 class="font-medium text-gray-800 truncate">example-document.pdf</h3>
                                <div class="flex space-x-2">
                                    <button class="text-gray-400 hover:text-purple-600 transition">
                                        <i class="fas fa-ellipsis-v"></i>
                                    </button>
                                </div>
                            </div>
                            <p class="text-sm text-gray-500 mb-2">2.4 MB</p>
                            <p class="text-xs text-gray-400">Uploaded: 10 minutes ago</p>
                        </div>
                    </div>
                </div>

                <div id="empty-state" class="text-center py-12">
                    <div class="mx-auto max-w-md">
                        <div class="bg-gray-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-folder-open text-gray-400 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-700 mb-2">No files uploaded yet</h3>
                        <p class="text-gray-500 mb-4">Upload your first file by clicking the button above</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

    <script>
        // Mock data for demonstration
        const mockFiles = [
            { id: 1, name: 'project-presentation.pdf', size: '3.2 MB', type: 'pdf', uploaded: '5 minutes ago', date: new Date(Date.now() - 5 * 60000) },
            { id: 2, name: 'vacation-photos.zip', size: '15.7 MB', type: 'zip', uploaded: '2 hours ago', date: new Date(Date.now() - 2 * 3600000) },
            { id: 3, name: 'budget-spreadsheet.xlsx', size: '1.1 MB', type: 'xlsx', uploaded: '1 day ago', date: new Date(Date.now() - 86400000) },
            { id: 4, name: 'project-requirements.docx', size: '0.8 MB', type: 'docx', uploaded: '2 days ago', date: new Date(Date.now() - 2 * 86400000) },
            { id: 5, name: 'team-photo.jpg', size: '2.5 MB', type: 'jpg', uploaded: '3 days ago', date: new Date(Date.now() - 3 * 86400000) },
            { id: 6, name: 'client-feedback.mp3', size: '4.3 MB', type: 'mp3', uploaded: '1 week ago', date: new Date(Date.now() - 7 * 86400000) }
        ];

        // DOM Elements
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const dropzone = document.getElementById('dropzone');
        const uploadProgress = document.getElementById('upload-progress');
        const progressBar = document.getElementById('progress-bar');
        const uploadPercentage = document.getElementById('upload-percentage');
        const fileList = document.getElementById('file-list');
        const emptyState = document.getElementById('empty-state');
        const refreshButton = document.getElementById('refresh-button');
        const sortButton = document.getElementById('sort-button');
        const sortOptions = document.getElementById('sort-options');
        const languageToggle = document.getElementById('language-toggle');
        const toastContainer = document.getElementById('toast-container');

        // Current state
        let files = [];
        let currentSort = 'date';

        // Initialize the app
        function init() {
            // Load mock files
            files = [...mockFiles];
            renderFileList();
            
            // Set up event listeners
            uploadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);
            
            // Drag and drop events
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, preventDefaults, false);
            });
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropzone.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, unhighlight, false);
            });
            
            dropzone.addEventListener('drop', handleDrop, false);
            
            // Other UI interactions
            refreshButton.addEventListener('click', refreshFiles);
            sortButton.addEventListener('click', toggleSortOptions);
            
            document.querySelectorAll('.sort-option').forEach(option => {
                option.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentSort = e.target.dataset.sort;
                    sortFiles();
                    sortOptions.classList.add('hidden');
                });
            });
            
            languageToggle.addEventListener('click', toggleLanguage);
            
            // Close sort options when clicking outside
            document.addEventListener('click', (e) => {
                if (!sortButton.contains(e.target) && !sortOptions.contains(e.target)) {
                    sortOptions.classList.add('hidden');
                }
            });
            
            // Simulate real-time updates (in a real app, this would be from WebSocket)
            setInterval(simulateRealTimeUpdate, 10000);
        }

        // Prevent default drag and drop behavior
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight dropzone when dragging over
        function highlight() {
            dropzone.classList.add('drag-over');
        }

        // Unhighlight dropzone
        function unhighlight() {
            dropzone.classList.remove('drag-over');
        }

        // Handle dropped files
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const droppedFiles = dt.files;
            handleFiles(droppedFiles);
        }

        // Handle file selection via input
        function handleFileSelect(e) {
            const selectedFiles = e.target.files;
            handleFiles(selectedFiles);
        }

        // Process selected files
        function handleFiles(fileList) {
            if (fileList.length === 0) return;
            
            // Show upload progress
            uploadProgress.classList.remove('hidden');
            
            // Simulate upload progress
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 10;
                if (progress > 100) progress = 100;
                
                progressBar.style.width = `${progress}%`;
                uploadPercentage.textContent = `${Math.round(progress)}%`;
                
                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        uploadProgress.classList.add('hidden');
                        progressBar.style.width = '0%';
                        uploadPercentage.textContent = '0%';
                        
                        // Add new files to the list
                        Array.from(fileList).forEach(file => {
                            const newFile = {
                                id: Date.now(),
                                name: file.name,
                                size: formatFileSize(file.size),
                                type: getFileType(file.name),
                                uploaded: 'Just now',
                                date: new Date()
                            };
                            files.unshift(newFile);
                        });
                        
                        sortFiles();
                        showToast('Files uploaded successfully!', 'success');
                    }, 500);
                }
            }, 200);
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // Get file type from name
        function getFileType(filename) {
            const extension = filename.split('.').pop().toLowerCase();
            const imageTypes = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
            const docTypes = ['doc', 'docx', 'txt', 'rtf'];
            const sheetTypes = ['xls', 'xlsx', 'csv'];
            const archiveTypes = ['zip', 'rar', '7z', 'tar', 'gz'];
            
            if (imageTypes.includes(extension)) return 'image';
            if (docTypes.includes(extension)) return 'doc';
            if (sheetTypes.includes(extension)) return 'sheet';
            if (archiveTypes.includes(extension)) return 'archive';
            if (extension === 'pdf') return 'pdf';
            if (extension === 'mp3' || extension === 'wav') return 'audio';
            if (extension === 'mp4' || extension === 'mov') return 'video';
            
            return 'file';
        }

        // Get icon for file type
        function getFileIcon(type) {
            const icons = {
                'image': 'fa-file-image',
                'doc': 'fa-file-word',
                'sheet': 'fa-file-excel',
                'pdf': 'fa-file-pdf',
                'audio': 'fa-file-audio',
                'video': 'fa-file-video',
                'archive': 'fa-file-archive',
                'file': 'fa-file'
            };
            return icons[type] || 'fa-file';
        }

        // Render the file list
        function renderFileList() {
            if (files.length === 0) {
                emptyState.classList.remove('hidden');
                fileList.classList.add('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            fileList.classList.remove('hidden');
            
            fileList.innerHTML = '';
            
            files.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item bg-white rounded-lg p-4 border border-gray-200 flex items-start';
                fileItem.innerHTML = `
                    <div class="mr-4">
                        <div class="bg-purple-100 text-purple-600 p-3 rounded-lg">
                            <i class="fas ${getFileIcon(file.type)} text-xl"></i>
                        </div>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h3 class="font-medium text-gray-800 truncate" title="${file.name}">${file.name}</h3>
                            <div class="flex space-x-2">
                                <button class="text-gray-400 hover:text-purple-600 transition file-download" data-id="${file.id}">
                                    <i class="fas fa-download"></i>
                                </button>
                                <button class="text-gray-400 hover:text-red-600 transition file-delete" data-id="${file.id}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <p class="text-sm text-gray-500 mb-2">${file.size}</p>
                        <p class="text-xs text-gray-400">Uploaded: ${file.uploaded}</p>
                    </div>
                `;
                
                fileList.appendChild(fileItem);
            });
            
            // Add event listeners to new buttons
            document.querySelectorAll('.file-download').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const fileId = parseInt(btn.dataset.id);
                    downloadFile(fileId);
                });
            });
            
            document.querySelectorAll('.file-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const fileId = parseInt(btn.dataset.id);
                    deleteFile(fileId);
                });
            });
            
            // Make file list sortable
            new Sortable(fileList, {
                animation: 150,
                handle: '.file-item',
                onEnd: () => {
                    // In a real app, we might save the new order
                }
            });
        }

        // Download file
        function downloadFile(fileId) {
            const file = files.find(f => f.id === fileId);
            if (file) {
                showToast(`Downloading ${file.name}...`, 'info');
                // In a real app, this would trigger an actual download
                // For demo, we'll just simulate it
                setTimeout(() => {
                    showToast(`${file.name} downloaded successfully!`, 'success');
                }, 1500);
            }
        }

        // Delete file
        function deleteFile(fileId) {
            const fileIndex = files.findIndex(f => f.id === fileId);
            if (fileIndex !== -1) {
                const fileName = files[fileIndex].name;
                files.splice(fileIndex, 1);
                renderFileList();
                showToast(`${fileName} deleted successfully!`, 'success');
                
                // In a real app, we would also notify the server to delete the file
            }
        }

        // Refresh files
        function refreshFiles() {
            showToast('Refreshing file list...', 'info');
            // In a real app, this would fetch the latest files from the server
            setTimeout(() => {
                showToast('File list updated!', 'success');
            }, 1000);
        }

        // Toggle sort options
        function toggleSortOptions(e) {
            e.stopPropagation();
            sortOptions.classList.toggle('hidden');
        }

        // Sort files
        function sortFiles() {
            switch (currentSort) {
                case 'name':
                    files.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'date':
                    files.sort((a, b) => b.date - a.date);
                    break;
                case 'size':
                    // This is simplified - in a real app we'd compare actual bytes
                    files.sort((a, b) => {
                        const aSize = parseFloat(a.size);
                        const bSize = parseFloat(b.size);
                        return bSize - aSize;
                    });
                    break;
            }
            renderFileList();
        }

        // Toggle language
        function toggleLanguage() {
            const currentLang = languageToggle.querySelector('span').textContent;
            const newLang = currentLang === 'EN' ? 'TR' : 'EN';
            languageToggle.querySelector('span').textContent = newLang;
            showToast(`Language changed to ${newLang}`, 'info');
        }

        // Show toast notification
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast bg-white rounded-lg shadow-md p-4 flex items-start border-l-4 ${
                type === 'success' ? 'border-green-500' : 
                type === 'error' ? 'border-red-500' : 
                type === 'info' ? 'border-blue-500' : 'border-gray-500'
            }`;
            
            const iconClass = type === 'success' ? 'fa-check-circle text-green-500' : 
                            type === 'error' ? 'fa-exclamation-circle text-red-500' : 
                            type === 'info' ? 'fa-info-circle text-blue-500' : 'fa-bell text-gray-500';
            
            toast.innerHTML = `
                <i class="fas ${iconClass} mr-3 mt-1"></i>
                <div class="flex-1">
                    <p class="text-sm font-medium text-gray-800">${message}</p>
                </div>
                <button class="ml-4 text-gray-400 hover:text-gray-600 toast-close">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            toastContainer.appendChild(toast);
            
            // Close button
            toast.querySelector('.toast-close').addEventListener('click', () => {
                toast.remove();
            });
            
            // Auto-remove after some time
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }

        // Simulate real-time updates (for demo purposes)
        function simulateRealTimeUpdate() {
            if (Math.random() > 0.7) { // 30% chance of an update
                const actions = ['upload', 'delete'];
                const action = actions[Math.floor(Math.random() * actions.length)];
                
                if (action === 'upload' && files.length < 10) {
                    const newFile = {
                        id: Date.now(),
                        name: `new-file-${Math.floor(Math.random() * 1000)}.${['pdf', 'docx', 'jpg', 'png', 'mp3'][Math.floor(Math.random() * 5)]}`,
                        size: `${(Math.random() * 10).toFixed(1)} MB`,
                        type: getFileType('test.pdf'), // Just using pdf as example
                        uploaded: 'Just now',
                        date: new Date()
                    };
                    files.unshift(newFile);
                    sortFiles();
                    showToast(`${newFile.name} was uploaded by another device`, 'info');
                } else if (action === 'delete' && files.length > 3) {
                    const randomIndex = Math.floor(Math.random() * files.length);
                    const deletedFile = files[randomIndex];
                    files.splice(randomIndex, 1);
                    renderFileList();
                    showToast(`${deletedFile.name} was deleted by another device`, 'info');
                }
            }
        }

        // Initialize the app
        init();
    </script>
</body>
</html>
